<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Stage Dispatcher</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      padding: 20px;
    }

    h1 {
      margin-bottom: 20px;
    }

    .stage {
      background: white;
      padding: 15px;
      margin-bottom: 15px;
      border-radius: 10px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }

    button {
      margin-right: 10px;
      padding: 8px 12px;
      cursor: pointer;
    }
  </style>
</head>

<body>

<h1>Stage Dispatcher</h1>

<div class="stage">
  <h2>STG-1</h2>
  <button onclick="alert('JOIN STG-1')">Join</button>
  <button onclick="alert('LEAVE STG-1')">Leave</button>
</div>

<div class="stage">
  <h2>STG-2</h2>
  <button onclick="alert('JOIN STG-2')">Join</button>
  <button onclick="alert('LEAVE STG-2')">Leave</button>
</div>

<div class="stage">
  <h2>STG-3</h2>
  <button onclick="alert('JOIN STG-3')">Join</button>
  <button onclick="alert('LEAVE STG-3')">Leave</button>
</div>

<div class="stage">
  <h2>STG-4</h2>
  <button onclick="alert('JOIN STG-4')">Join</button>
  <button onclick="alert('LEAVE STG-4')">Leave</button>
</div>

</body>
</html>
